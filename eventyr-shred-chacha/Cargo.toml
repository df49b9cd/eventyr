[package]
name = "eventyr-shred-chacha"
description = "XChaCha20-Poly1305 cipher adapter for eventyr-shred."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords = ["event-sourcing", "gdpr", "crypto-shredding", "chacha20poly1305"]
repository = "https://github.com/df49b9cd/eventyr"
readme = "README.md"
homepage = "https://github.com/df49b9cd/eventyr"
categories = ["database"]
documentation = "https://docs.rs/eventyr-shred-chacha"

[lints]
workspace = true

[dependencies]
eventyr-shred = { workspace = true, features = ["aead"] }
chacha20poly1305 = { workspace = true, features = ["alloc", "getrandom"] }

[dev-dependencies]
eventyr-shred = { path = "../eventyr-shred", features = ["testing"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
