[package]
name = "eventyr-store-fjall"
description = "Embedded (fjall / LSM) event store for eventyr — no server, no runtime needed to drive."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords = ["event-sourcing", "embedded", "fjall", "kv"]

[lints]
workspace = true

[features]
default = []
# The `SnapshotStore` implementation over a third partition. Off by
# default: stores that only want the event log pay nothing.
snapshots = []

[dependencies]
eventyr-core = { workspace = true, features = ["serde"] }
eventyr-store = { workspace = true }
fjall.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
futures.workspace = true

# dev-dependency on ourselves so the contract-suite tests can turn on
# the feature (a crate's own --features don't reach `tests/`).
[dev-dependencies]
eventyr-store-fjall = { path = ".", features = ["snapshots"] }
eventyr-store-testing = { workspace = true, features = ["serde"] }
tempfile.workspace = true
