[package]
name = "eventyr-store"
description = "Store-side traits for eventyr: EventStore, StreamsAll, drivers, and the repository."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords = ["event-sourcing", "cqrs", "event-store"]

[lints]
workspace = true

[features]
default = []
# The reference backend for the `Metrics` port: a `tracing` event per
# instrument call. The port itself lives in `eventyr-core`; the feature
# enables the dep, no re-gating.
tracing = ["dep:tracing"]
# `AggregateRepository::load_until` (0.7.8): fold a stream to an instant.
# Mirrors `Metadata::timestamp`, which is `eventyr-core`'s `time`.
time = ["eventyr-core/time", "dep:time"]

[dependencies]
eventyr-core = { workspace = true }
futures = { workspace = true, features = ["executor"] }
# The in-process commit signal (0.7.2): a multi-listener wake-up.
event-listener.workspace = true
tracing = { workspace = true, optional = true }
time = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
# The `time` feature's tests run under plain `cargo test -p eventyr-store`.
eventyr-store = { path = ".", features = ["time"] }
# The snapshot contract the in-memory store's test runs.
eventyr-store-testing = { workspace = true, features = ["serde"] }
