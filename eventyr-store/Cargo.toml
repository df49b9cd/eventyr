[package]
name = "eventyr-store"
description = "Store-side traits for eventyr: EventStore, StreamsAll, drivers, and the repository."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords = ["event-sourcing", "cqrs", "event-store"]

[lints]
workspace = true

[dependencies]
eventyr-core = { workspace = true }
futures = { version = "0.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
