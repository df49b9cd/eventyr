[package]
name = "eventyr"
description = "Event sourcing for Rust — pure machines, thin drivers. Umbrella crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords = ["event-sourcing", "cqrs", "event-store", "sans-io", "ddd"]

[lints]
workspace = true

[features]
default = ["time", "macros", "store"]
# Carries `Metadata::timestamp` through the re-exported core.
time = ["eventyr-core/time"]
# Re-exports the derive macros through the re-exported core.
macros = ["eventyr-core/macros"]
# Re-exports the store side: ports, in-memory store, driver, repository.
store = ["dep:eventyr-store"]
# Re-exports the subscription side: projector runner, checkpoint store.
subscription = ["store", "dep:eventyr-subscription"]
# The §2 EventBus / §6 Subscription trait (live-push seam, 0.3).
bus = ["subscription", "eventyr-subscription/bus"]
# Re-exports the read-path layer: upcaster chains, raw→typed sources,
# schema-versioned rebuilds.
projection = ["subscription", "dep:eventyr-projection"]
# The Postgres store, with its snapshot persistence enabled.
postgres = ["store", "dep:eventyr-store-postgres"]
snapshots = ["postgres", "eventyr-store-postgres/snapshots"]
# The embedded store over fjall (no server, no runtime needed to drive).
fjall = ["store", "dep:eventyr-store-fjall"]
# The embedded store over SQLite — the contract suite's reference port.
sqlite = ["store", "dep:eventyr-store-sqlite"]
sqlite_snapshots = ["sqlite", "eventyr-store-sqlite/snapshots"]
# SQLite's view store and inline views (0.7.3).
sqlite_views = ["sqlite", "projection", "eventyr-store-sqlite/views"]
# The `Metrics` port's tracing backend (0.5.3): store/projector drivers
# report through it when this feature is on.
metrics = ["store", "eventyr-store/tracing"]

[dependencies]
eventyr-core = { workspace = true }
eventyr-store = { workspace = true, optional = true }
eventyr-store-fjall = { workspace = true, optional = true }
eventyr-store-postgres = { workspace = true, optional = true }
eventyr-store-sqlite = { workspace = true, optional = true }
eventyr-subscription = { workspace = true, optional = true }
eventyr-projection = { workspace = true, optional = true }

[dev-dependencies]
# Examples: the bank demo drives the async drivers and reads raw events.
tokio = { version = "1", features = ["rt", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
futures = { version = "0.3", default-features = false }

