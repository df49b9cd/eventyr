[package]
name = "eventyr"
description = "Event sourcing for Rust — pure machines, thin drivers. Umbrella crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords = ["event-sourcing", "cqrs", "event-store", "sans-io", "ddd"]

[lints]
workspace = true

[features]
default = ["time", "macros", "store"]
# Carries `Metadata::timestamp` through the re-exported core.
time = ["eventyr-core/time"]
# Re-exports the derive macros through the re-exported core.
macros = ["eventyr-core/macros"]
# Re-exports the store side: ports, in-memory store, driver, repository.
store = ["dep:eventyr-store"]
# Re-exports the subscription side: projector runner, checkpoint store.
subscription = ["store", "dep:eventyr-subscription"]
# The §2 EventBus / §6 Subscription trait (live-push seam, 0.3).
bus = ["subscription", "eventyr-subscription/bus"]

[dependencies]
eventyr-core = { workspace = true }
eventyr-store = { workspace = true, optional = true }
eventyr-subscription = { workspace = true, optional = true }
