[package]
name = "eventyr-core"
description = "Pure sans-IO core for event sourcing: the Aggregate trait, protocol vocabulary, and the write machine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords = ["event-sourcing", "cqrs", "event-store", "sans-io", "no-std"]

[lints]
workspace = true

[features]
default = []
# Carries `Metadata::timestamp` (`Option<OffsetDateTime>`). Off here, on in the
# umbrella crate — the rest of the core needs no runtime at all.
time = ["dep:time"]
# Re-exports the derive macros from `eventyr-macros`, so eventyr-core is the
# one dependency a derive user needs. Off by default: the core stays
# dependency-free unless you ask for the sugar.
macros = ["dep:eventyr-macros"]
# Derives Serialize/Deserialize on the value types (the vocabulary, the
# envelopes, the metadata) — the serde glue a store needs. Off by default.
serde = ["dep:serde", "time?/serde"]

[dependencies]
eventyr-macros = { workspace = true, optional = true }
serde = { version = "1", default-features = false, features = ["alloc", "derive"], optional = true }
time = { version = "0.3", default-features = false, optional = true }

[dev-dependencies]
proptest = "1"
