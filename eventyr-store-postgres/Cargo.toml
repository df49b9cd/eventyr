[package]
name = "eventyr-store-postgres"
description = "Postgres event store for eventyr, via sqlx."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords = ["event-sourcing", "postgres", "sqlx"]

[lints]
workspace = true

[features]
default = []
# Populates `Metadata::timestamp` from `created_at`. Turns on core's
# `time` field and sqlx's `OffsetDateTime` decode.
time = ["eventyr-core/time", "sqlx/time", "dep:time"]
# The `SnapshotStore` implementation over the `snapshots` migration.
# Off by default: stores that only want the event log pay nothing.
snapshots = []

[dependencies]
eventyr-core = { workspace = true, features = ["serde"] }
eventyr-store = { workspace = true }
eventyr-projection = { workspace = true }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "json",
    "migrate",
    "macros",
] }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
thiserror = { version = "2", default-features = false }
async-stream = { version = "0.3", default-features = false }
futures = { version = "0.3", default-features = false, features = ["alloc", "std"] }
time = { version = "0.3", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4"] }
eventyr-store-testing = { workspace = true }
