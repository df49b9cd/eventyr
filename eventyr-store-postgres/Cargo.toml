[package]
name = "eventyr-store-postgres"
description = "Postgres event store for eventyr, via sqlx."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords = ["event-sourcing", "postgres", "sqlx"]

[lints]
workspace = true

[features]
default = []
# Populates `Metadata::timestamp` from `created_at`. Turns on core's
# `time` field and sqlx's `OffsetDateTime` decode.
time = ["eventyr-core/time", "sqlx/time", "dep:time"]
# The `SnapshotStore` implementation over the `snapshots` migration.
# Off by default: stores that only want the event log pay nothing.
snapshots = []
# The `ViewStore` port and inline views (0.7.3), over the `views` table.
views = ["dep:eventyr-projection"]
# A durable `CheckpointStore` for subscriptions, over the `checkpoints`
# table (migration 0011).
checkpoints = ["dep:eventyr-subscription"]

[dependencies]
eventyr-core = { workspace = true, features = ["serde"] }
eventyr-store = { workspace = true }
eventyr-projection = { workspace = true, features = ["inline"], optional = true }
eventyr-subscription = { workspace = true, optional = true }
sqlx = { workspace = true, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "json",
    "migrate",
    "macros",
] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-stream.workspace = true
futures = { workspace = true, features = ["std"] }
time = { workspace = true, optional = true }

# dev-dependency on ourselves so the tests can turn on the features
# they exercise (a crate's own --features don't reach `tests/`).
[dev-dependencies]
eventyr-store-postgres = { path = ".", features = ["snapshots", "views", "checkpoints"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
eventyr-projection = { workspace = true, features = ["inline"] }
eventyr-subscription = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
eventyr-store-testing = { workspace = true, features = ["serde"] }
