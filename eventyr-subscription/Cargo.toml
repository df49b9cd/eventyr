[package]
name = "eventyr-subscription"
description = "Catch-up subscriptions and the event bus trait for eventyr."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords = ["event-sourcing", "subscription", "event-bus"]

[lints]
workspace = true

[features]
default = []
# The §6 Subscription / §2 EventBus seam: ship as transport adapters land (0.3).
bus = []
# Exports `parked_store_contract`, for parked-store implementations'
# tests. Not for production builds.
testing = []

[dependencies]
eventyr-core.workspace = true
eventyr-store = { workspace = true }
futures = { workspace = true, features = ["executor"] }
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "test-util"] }
