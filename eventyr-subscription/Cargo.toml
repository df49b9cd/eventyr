[package]
name = "eventyr-subscription"
description = "Catch-up subscriptions and the event bus trait for eventyr."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords = ["event-sourcing", "subscription", "event-bus"]

[lints]
workspace = true

[features]
default = []
# The §6 Subscription / §2 EventBus seam: ship as transport adapters land (0.3).
bus = []

[dependencies]
eventyr-core = { workspace = true, features = ["std"] }
eventyr-store = { workspace = true }
futures = { version = "0.3", default-features = false, features = ["alloc", "executor"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
