[package]
name = "eventyr-shred-aes-gcm"
description = "AES-256-GCM cipher adapter for eventyr-shred."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords = ["event-sourcing", "gdpr", "crypto-shredding", "aes-gcm"]
repository = "https://github.com/df49b9cd/eventyr"
readme = "README.md"
homepage = "https://github.com/df49b9cd/eventyr"
categories = ["database"]
documentation = "https://docs.rs/eventyr-shred-aes-gcm"

[lints]
workspace = true

[dependencies]
eventyr-shred = { workspace = true, features = ["aead"] }
aes-gcm = { workspace = true, features = ["aes", "alloc", "getrandom"] }

[dev-dependencies]
eventyr-shred = { path = "../eventyr-shred", features = ["testing"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
