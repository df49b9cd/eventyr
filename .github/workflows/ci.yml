name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The integration tests' database (the `pg` service below).
  EVENTYR_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/eventyr

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eventyr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Check
        run: cargo check --workspace --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Docs
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # Unit, integration, contract, and doc tests across the workspace.
      - name: Tests
        run: cargo test --workspace --all-features

      # The Postgres-backed suites are `#[ignore]`d for casual `cargo
      # test`; the service above makes the URL real, so run them here.
      - name: Postgres integration tests
        run: cargo test -p eventyr-store-postgres --features snapshots,time -- --ignored

      # The no_std core builds for a bare-metal target: this is where
      # "no_std" is proven, not asserted.
      - name: no_std core
        run: |
          rustup target add thumbv7em-none-eabihf
          cargo build -p eventyr-core --no-default-features --target thumbv7em-none-eabihf
          cargo build -p eventyr-core --no-default-features --features serde,time --target thumbv7em-none-eabihf

      # Feature powersets: every crate's no-default-features build, plus
      # each single feature of the crates whose features are meant to
      # combine or stay off (cargo-hack's checks, approximated without
      # the extra runner install).
      # Feature powersets via cargo-hack: `--each-feature --no-dev-deps`
      # for every crate, so one feature never depends on another being
      # on by accident. (Locally the same thing, since cargo-hack may
      # not be installed: check `--no-default-features` per crate and
      # each single feature.)
      - name: cargo-hack (feature powersets)
        uses: taiki-e/install-action@cargo-hack
      - name: Feature checks
        run: cargo hack check --workspace --each-feature --no-dev-deps

  # Miri over the core: UB checks on the machines and their proptests.
  # Scoped to what finishes; timed at ~6 minutes locally.
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Miri (eventyr-core)
        run: cargo miri test -p eventyr-core --lib
        env:
          # Proptest's failure-persistence file reads need the sandbox
          # off; the cases count keeps the job timed like the default.
          MIRIFLAGS: -Zmiri-disable-isolation
          PROPTEST_CASES: "4"
