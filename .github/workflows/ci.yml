name: CI

on:
  push:
    branches: [main]
  pull_request:

# A re-pushed branch does not need the superseded run; the pg container
# and miri are too expensive to queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The integration tests' database (the `pg` service below).
  EVENTYR_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/eventyr

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eventyr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # Third-party actions are pinned to the commit their tag resolved
      # to, so a moved tag cannot change what CI runs. The toolchain
      # branches (@stable, @nightly) are the deliberate exception: they
      # exist to move.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Format
        run: cargo fmt --all --check

      # `--locked`: Cargo.lock is committed; a step that resolves
      # differently than the lock says is a failure, not a silent
      # re-resolution.
      - name: Check
        run: cargo check --workspace --all-features --locked

      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

      - name: Docs
        run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      # Unit, integration, contract, and doc tests across the workspace.
      - name: Tests
        run: cargo test --workspace --all-features --locked

      # The examples are the §0.5.4 worked domain end to end: run them,
      # so their asserts gate CI, not just their compilation.
      - name: Examples run
        run: |
          cargo run -p eventyr --example bank --all-features --locked
          cargo run -p eventyr --example enrollment --locked
          cargo run -p eventyr --example loan_eligibility --locked
          cargo run -p eventyr --example inline_view --features sqlite_views --locked
          cargo run -p eventyr --example distributed --features sqlite_views,sqlite_checkpoints,postgres_checkpoints,postgres_leases,postgres_views --locked
        # The distributed example's clustered half runs against the
        # service database, in a throwaway schema.
        env:
          EVENTYR_PG_URL: ${{ env.EVENTYR_TEST_PG_URL }}

      # The Postgres-backed suites are `#[ignore]`d for casual `cargo
      # test`; the service above makes the URL real, so run them here.
      # Serial only: the inline-views and contract suites each hold
      # transactions, which deadlocks exhaust a 100-connection container.
      # (Schema safety no longer needs it — each test's schemas live in
      # its own SchemaScope and a parallel run drops only its own.)
      - name: Postgres integration tests
        run: cargo test -p eventyr-store-postgres --features snapshots,time --locked -- --ignored --test-threads=1

      # The no_std core builds for a bare-metal target: this is where
      # "no_std" is proven, not asserted.
      - name: no_std core
        run: |
          rustup target add thumbv7em-none-eabihf
          cargo build -p eventyr-core --no-default-features --target thumbv7em-none-eabihf --locked
          cargo build -p eventyr-core --no-default-features --features serde,time --target thumbv7em-none-eabihf --locked

      # Feature powersets via cargo-hack: `--each-feature --no-dev-deps`
      # for every crate, so one feature never depends on another being
      # on by accident. (Locally the same thing without the install:
      # check `--no-default-features` per crate and each single feature.)
      - name: cargo-hack (feature powersets)
        uses: taiki-e/install-action@a561ea09b94560aba5b8b2b78e1562ec242dc5f8 # cargo-hack
      - name: Feature checks
        # No `--locked` here: `--no-dev-deps` rewrites each manifest
        # while it runs, and the rewrite legitimately changes what the
        # lock resolves — every other cargo step pins the lock.
        run: cargo hack check --workspace --each-feature --no-dev-deps

  # The crates must stay publishable: path-only dev-deps between
  # workspace members, the packaged README, and the metadata the
  # crates.io/docs.rs pages need. Publishing stays manual; this
  # verifies `cargo package` can build every crate — from its tarball,
  # against a throwaway registry of the packaged siblings, which is
  # the closest thing to the real first release until the crates are
  # on crates.io. The per-crate READMEs are symlinks to the root one;
  # packaging dereferences them (the facade's include_str! resolves to
  # the crate's own README inside the tarball), and the verified build
  # fails if that ever stops holding.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Package (dry run)
        run: cargo package --workspace --locked

  # rust-version = "1.99" is a promise in the README: prove the
  # workspace checks on exactly that toolchain, so a dependency or
  # an API added on a newer stable cannot raise it silently.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # 1.99.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Check (MSRV)
        run: cargo check --workspace --all-features --locked

  # Miri over the core: UB checks on the machines and their proptests.
  # Scoped to what finishes; timed at ~6 minutes locally.
  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@f0d5300ba8908d942c808f4d31c08471d7798ba3 # nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Miri (eventyr-core)
        run: cargo miri test -p eventyr-core --lib --locked
        env:
          # Proptest's failure-persistence file reads need the sandbox
          # off; the cases count keeps the job timed like the default.
          MIRIFLAGS: -Zmiri-disable-isolation
          PROPTEST_CASES: "4"
