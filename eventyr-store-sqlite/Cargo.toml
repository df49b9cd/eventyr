[package]
name = "eventyr-store-sqlite"
description = "SQLite event store for eventyr — embedded, zero-server, the contract-suite reference port."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords = ["event-sourcing", "sqlite", "event-store"]

[lints]
workspace = true

[features]
default = []
# The `SnapshotStore` implementation over a second table. Off by
# default: stores that only want the event log pay nothing.
snapshots = []
# The `views` table: the `ViewStore` port and inline views (0.7.3).
views = ["dep:eventyr-projection"]
# A crypto-shredding `KeyStore` (0.7.6).
shred = ["dep:eventyr-shred"]
# A `ParkedStore` for subscriptions' poison events (0.7.7).
parked = ["dep:eventyr-subscription"]
# A durable `CheckpointStore` for subscriptions.
checkpoints = ["dep:eventyr-subscription"]

[dependencies]
eventyr-core = { workspace = true, features = ["serde"] }
eventyr-store = { workspace = true }
eventyr-projection = { workspace = true, features = ["inline"], optional = true }
eventyr-shred = { workspace = true, optional = true }
eventyr-subscription = { workspace = true, optional = true }
rusqlite = { workspace = true, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
futures.workspace = true

# dev-dependency on ourselves so the contract-suite tests can toggle
# the feature (a crate's own --features don't reach `tests/`).
[dev-dependencies]
eventyr-store-sqlite = { path = ".", features = ["snapshots", "views", "shred", "parked", "checkpoints"] }
eventyr-shred = { workspace = true, features = ["testing"] }
eventyr-shred-chacha = { workspace = true }
eventyr-store-testing = { workspace = true, features = ["serde"] }
eventyr-subscription = { workspace = true, features = ["testing"] }
