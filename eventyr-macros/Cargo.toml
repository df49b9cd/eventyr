[package]
name = "eventyr-macros"
description = "Derive macros for eventyr: #[derive(Aggregate)] and #[derive(EventName)]."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords = ["event-sourcing", "cqrs", "proc-macro"]

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = "3"

[dev-dependencies]
eventyr-core = { workspace = true }
eventyr = { path = "../eventyr" }
trybuild = "1"
