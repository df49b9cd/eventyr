[package]
name = "eventyr-macros"
description = "Derive macros for eventyr: #[derive(Aggregate)] and #[derive(EventName)]."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords = ["event-sourcing", "cqrs", "proc-macro"]

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

[dev-dependencies]
eventyr-core = { workspace = true }
eventyr = { path = "../eventyr" }
trybuild.workspace = true
# `std`: the pass test's internally tagged enum needs serde's buffering,
# and trybuild builds it in a target of its own — no unification.
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
