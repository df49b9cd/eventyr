[package]
name = "eventyr-store-testing"
description = "Contract tests any eventyr EventStore / SnapshotStore implementation must pass."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords = ["event-sourcing", "event-store", "testing"]

[lints]
workspace = true

[features]
default = []
# Serde derives on the fixture events (`PayloadEvent`, `ParityEvent`), so
# durable stores can run the contracts on them.
serde = ["dep:serde"]

[dependencies]
eventyr-core = { workspace = true }
eventyr-store = { workspace = true }
futures = { version = "0.3", default-features = false, features = ["alloc", "executor"] }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

