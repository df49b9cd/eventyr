[package]
name = "eventyr-store-testing"
description = "Contract tests any eventyr EventStore / SnapshotStore implementation must pass."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords = ["event-sourcing", "event-store", "testing"]
repository = "https://github.com/df49b9cd/eventyr"
readme = "README.md"
homepage = "https://github.com/df49b9cd/eventyr"
categories = ["database"]
documentation = "https://docs.rs/eventyr-store-testing"

[lints]
workspace = true

[features]
default = []
# Serde derives on the fixture events (`PayloadEvent`, `ParityEvent`), so
# durable stores can run the contracts on them.
serde = ["dep:serde"]

[dependencies]
eventyr-core = { workspace = true }
eventyr-store = { workspace = true }
futures = { workspace = true, features = ["executor"] }
serde = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
